name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: minesweeper-rs-linux
            binary_path: target/release/minesweeper-rs
          - os: windows-latest
            artifact_name: minesweeper-rs-windows
            binary_path: target/release/minesweeper-rs.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libasound2-dev \
          libudev-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libx11-dev \
          libxcursor-dev \
          libxi-dev \
          libxrandr-dev

    - name: Build release
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.binary_path }}
        if-no-files-found: error
